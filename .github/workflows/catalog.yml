name: Build catalog
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty uses latest)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify packages and generate catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          APK_POLICY: ${{ secrets.APK_POLICY }}
        run: python3 scripts/catalog.py
